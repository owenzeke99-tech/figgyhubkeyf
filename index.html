
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figgy Hub - Premium Key System</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

:root {
    --purple: #9333ea;
    --light: #c084fc;
    --dark: #08060e;
    --panel: #120d1d;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background: var(--dark);
    color: white;
    font-family: Inter, sans-serif;
}

/* BACKGROUND */
.background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background:
        radial-gradient(ellipse at 20% 20%, #581c8730, transparent 45%),
        radial-gradient(ellipse at 80% 80%, #7e22ce25, transparent 45%),
        #08060e;
}

.glow {
    position: absolute;
    width: 350px;
    height: 350px;
    border-radius: 50%;
    filter: blur(110px);
    opacity: .32;
    animation: float 9s ease-in-out infinite alternate;
}

.glow.one {
    background: #9333ea;
    top: -130px;
    left: -100px;
}

.glow.two {
    background: #6d28d9;
    bottom: -150px;
    right: -100px;
    animation-delay: -4s;
}

@keyframes float {
    to { transform: translate(100px, 80px) scale(1.3); }
}

/* PARTICLES */
#particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

.particle {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #c084fc;
    box-shadow: 0 0 12px #a855f7;
    animation: particleMove linear infinite;
}

@keyframes particleMove {
    0% { transform: translateY(110vh); opacity: 0; }
    15% { opacity: .9; }
    85% { opacity: .7; }
    100% { transform: translateY(-10vh); opacity: 0; }
}

/* CARD */
.container {
    width: min(90%, 410px);
    position: relative;
    z-index: 2;
    padding: 34px 27px;
    border-radius: 25px;
    border: 1px solid #a855f733;
    background: linear-gradient(145deg, #1b1228eF, #0d0a15f5);
    backdrop-filter: blur(25px);
    box-shadow:
        0 20px 80px #0009,
        0 0 40px #9333ea12,
        inset 0 1px #ffffff0b;
    animation: cardIn .8s cubic-bezier(.2,.8,.2,1);
}

.container::before {
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: 25px;
    padding: 1px;
    background: linear-gradient(120deg, #c084fc66, transparent 35%, #9333ea66);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
}

@keyframes cardIn {
    from {
        opacity: 0;
        transform: translateY(35px) scale(.94);
        filter: blur(8px);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
    }
}

/* LOGO */
.logo-wrap {
    width: 100px;
    height: 100px;
    margin: 0 auto 19px;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 30px;
    background: linear-gradient(145deg, #35164e, #170d27);
    border: 1px solid #c084fc55;
    box-shadow: 0 0 35px #9333ea35;
    animation: logoFloat 4s ease-in-out infinite;
}

.logo-wrap::after {
    content: "";
    position: absolute;
    inset: -7px;
    border: 1px solid #a855f744;
    border-radius: 35px;
    animation: logoBorder 4s linear infinite;
}

@keyframes logoFloat {
    50% { transform: translateY(-7px); }
}

@keyframes logoBorder {
    50% { transform: scale(1.07); opacity: .3; }
}

.garlic {
    width: 73px;
    height: 80px;
    filter: drop-shadow(0 0 12px #c084fc77);
}

/* TITLE */
h1 {
    text-align: center;
    font-size: 32px;
    font-weight: 900;
    letter-spacing: -1px;
    background: linear-gradient(100deg, #fff, #d8b4fe, #a855f7);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    animation: titleGlow 4s ease-in-out infinite;
}

@keyframes titleGlow {
    50% { filter: drop-shadow(0 0 12px #9333ea66); }
}

.subtitle {
    text-align: center;
    margin-top: 8px;
    color: #9b8ba9;
    font-size: 12px;
    letter-spacing: 1.4px;
}

/* STATUS */
.status {
    width: fit-content;
    margin: 24px auto;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 16px;
    border-radius: 30px;
    background: #22c55e0c;
    border: 1px solid #4ade8033;
    color: #86efac;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
}

.status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #4ade80;
    box-shadow: 0 0 12px #4ade80;
    animation: blink 1.5s infinite;
}

@keyframes blink {
    50% { opacity: .35; }
}

/* KEY SECTION */
.key-section {
    position: relative;
    padding: 18px;
    border-radius: 17px;
    background: #090711;
    border: 1px solid #9333ea35;
    overflow: hidden;
    transition: .35s;
}

.key-section:hover {
    border-color: #c084fc99;
    box-shadow: 0 0 25px #9333ea20;
    transform: translateY(-2px);
}

.key-section::before {
    content: "";
    position: absolute;
    top: 0;
    left: -120%;
    width: 70%;
    height: 1px;
    background: linear-gradient(90deg, transparent, #d8b4fe, transparent);
    animation: scan 4s ease-in-out infinite;
}

@keyframes scan {
    to { left: 150%; }
}

.key-label {
    color: #a78bbd;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 2px;
    margin-bottom: 12px;
}

.key-content {
    display: flex;
    align-items: center;
    gap: 10px;
}

.key-value {
    flex: 1;
    min-width: 0;
    color: #e9d5ff;
    font-size: 11px;
    font-weight: 600;
    line-height: 1.7;
    overflow-wrap: anywhere;
}

.key-icon {
    color: #c084fc;
    font-size: 19px;
}

/* COPY BUTTON */
.copy-btn {
    position: relative;
    overflow: hidden;
    width: 100%;
    height: 51px;
    margin-top: 16px;
    border: none;
    border-radius: 13px;
    cursor: pointer;
    color: white;
    background: linear-gradient(105deg, #7e22ce, #9333ea, #6d28d9);
    background-size: 200% 200%;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1.3px;
    box-shadow: 0 7px 25px #9333ea40;
    transition: .3s;
    animation: gradientMove 5s ease infinite;
}

@keyframes gradientMove {
    50% { background-position: 100% 50%; }
}

.copy-btn::before {
    content: "";
    position: absolute;
    top: 0;
    left: -120%;
    width: 60%;
    height: 100%;
    background: linear-gradient(90deg, transparent, #ffffff40, transparent);
    transform: skewX(-20deg);
    transition: .6s;
}

.copy-btn:hover::before {
    left: 150%;
}

.copy-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 35px #9333ea77;
}

.copy-btn:active {
    transform: scale(.97);
}

/* EXTRA INFO */
.bottom-info {
    display: flex;
    justify-content: space-between;
    margin-top: 22px;
    padding-top: 17px;
    border-top: 1px solid #ffffff0d;
    color: #71647e;
    font-size: 10px;
}

.bottom-info span:last-child {
    color: #c084fc;
}

/* NOTIFICATION */
.notification {
    position: fixed;
    z-index: 10;
    top: 22px;
    left: 50%;
    width: max-content;
    max-width: 90%;
    padding: 14px 19px;
    border-radius: 13px;
    background: #1b1427;
    border: 1px solid #a855f766;
    box-shadow: 0 10px 40px #0009, 0 0 20px #9333ea22;
    color: #e9d5ff;
    font-size: 12px;
    font-weight: 700;
    opacity: 0;
    transform: translate(-50%, -100px);
    transition: .45s cubic-bezier(.2,.8,.2,1);
    pointer-events: none;
}

.notification.show {
    opacity: 1;
    transform: translate(-50%, 0);
}

.notification .check {
    color: #4ade80;
    margin-right: 7px;
}

@media(max-width: 420px) {
    .container {
        padding: 29px 21px;
    }
    h1 { font-size: 29px; }
}
</style>
</head>

<body>

<div class="background">
    <div class="glow one"></div>
    <div class="glow two"></div>
</div>

<div id="particles"></div>

<div class="notification" id="notification">
    <span class="check">✓</span>
    <span id="notificationText">Copied successfully!</span>
</div>

<main class="container">

    <!-- GARLIC LOGO -->
    <div class="logo-wrap">
        <svg class="garlic" viewBox="0 0 100 110" fill="none"
             xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="garlicColor" x1="15" y1="15" x2="85" y2="100">
                    <stop stop-color="#F3E8FF"/>
                    <stop offset=".35" stop-color="#C084FC"/>
                    <stop offset="1" stop-color="#6B21A8"/>
                </linearGradient>
                <linearGradient id="garlicSide" x1="50" y1="30" x2="90" y2="100">
                    <stop stop-color="#D8B4FE"/>
                    <stop offset="1" stop-color="#581C87"/>
                </linearGradient>
            </defs>

            <path d="M48 23 C43 15 45 7 51 3 C57 12 55 19 54 24"
                  fill="#C084FC" stroke="#E9D5FF" stroke-width="2"/>

            <path d="M49 23
                C36 20 25 30 24 43
                C10 47 8 66 17 81
                C24 94 37 100 50 105
                C63 100 78 92 84 77
                C92 59 84 45 75 42
                C72 29 61 21 49 23Z"
                fill="url(#garlicColor)"
                stroke="#E9D5FF"
                stroke-width="2"/>

            <path d="M49 25 C43 41 40 72 50 104"
                  stroke="#F3E8FF" stroke-width="2" opacity=".7"/>

            <path d="M48 26 C31 31 26 50 29 70 C31 84 39 95 50 104"
                  fill="#E9D5FF" opacity=".15"/>

            <path d="M52 26 C66 30 76 48 73 68 C71 85 61 98 50 104"
                  fill="url(#garlicSide)" opacity=".6"/>

            <path d="M23 91 C31 99 40 103 50 106 C61 102 72 96 79 87"
                  stroke="#E9D5FF" stroke-width="2" opacity=".8"/>

            <path d="M36 33 C29 42 28 54 30 64"
                  stroke="white" stroke-width="3"
                  stroke-linecap="round" opacity=".55"/>
        </svg>
    </div>

    <h1>Figgy Hub</h1>
    <p class="subtitle">PREMIUM ACCESS SYSTEM</p>

    <div class="status">
        <span class="status-dot"></span>
        SYSTEM ONLINE
    </div>

    <section class="key-section">
        <div class="key-label">YOUR PREMIUM ACCESS KEY</div>

        <div class="key-content">
            <div class="key-value" id="keyValue">
                FiggyHubKeyHdkeiwbLalowenJsmwoehhJdoeow
            </div>
            <span class="key-icon">✦</span>
        </div>
    </section>

    <button class="copy-btn" onclick="copyKey()" id="copyButton">
        <span id="buttonText">✧ &nbsp; COPY KEY &nbsp; ✧</span>
    </button>

    <div class="bottom-info">
        <span>FIGGY HUB © 2026</span>
        <span>PREMIUM VERSION</span>
    </div>

</main>

<script>
const KEY = "FiggyHubKeyHdkeiwbLalowenJsmwoehhJdoeow";

let notificationTimer;

async function copyKey() {
    const buttonText = document.getElementById("buttonText");

    try {
        if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(KEY);
        } else {
            const textarea = document.createElement("textarea");
            textarea.value = KEY;
            textarea.style.position = "fixed";
            textarea.style.opacity = "0";
            document.body.appendChild(textarea);
            textarea.select();

            const success = document.execCommand("copy");
            textarea.remove();

            if (!success) throw new Error("Copy failed");
        }

        buttonText.textContent = "✓  COPIED SUCCESSFULLY";
        showNotification("Key copied successfully!");

    } catch (error) {
        buttonText.textContent = "COPY FAILED";
        showNotification("Unable to copy key. Please try again.");
    }

    setTimeout(() => {
        buttonText.textContent = "✧  COPY KEY  ✧";
    }, 2200);
}

function showNotification(message) {
    const notification = document.getElementById("notification");
    document.getElementById("notificationText").textContent = message;

    notification.classList.add("show");

    clearTimeout(notificationTimer);

    notificationTimer = setTimeout(() => {
        notification.classList.remove("show");
    }, 2600);
}

/* PARTICLE GENERATOR */
const particleContainer = document.getElementById("particles");

for (let i = 0; i < 45; i++) {
    const particle = document.createElement("div");
    particle.className = "particle";

    particle.style.left = Math.random() * 100 + "%";
    particle.style.animationDuration = (7 + Math.random() * 12) + "s";
    particle.style.animationDelay = (Math.random() * 12) + "s";

    const size = 2 + Math.random() * 2;
    particle.style.width = size + "px";
    particle.style.height = size + "px";

    particleContainer.appendChild(particle);
}
</script>

</body>
</html>
